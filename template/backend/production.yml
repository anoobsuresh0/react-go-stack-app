services:
  traefik:
    image: traefik:v3.0
    container_name: {{PROJECT_NAME_SNAKE}}_traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${PROD_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"
    restart: unless-stopped

  backend:
    image: {{PROJECT_NAME_SNAKE}}:production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{PROJECT_NAME_SNAKE}}_backend
    environment:
      DATABASE_URL: postgres://${PROD_POSTGRES_USER}:${PROD_POSTGRES_PASSWORD}@db:5432/${PROD_POSTGRES_DB}?sslmode=disable
      PORT: 8080
      ENV: production
      CORS_ORIGINS: https://${PROD_DOMAIN}
      GOOGLE_CLIENT_ID: ${PROD_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${PROD_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://${PROD_DOMAIN}/api/auth/callback/google
      JWT_SECRET: ${PROD_JWT_SECRET}
      FRONTEND_URL: https://${PROD_DOMAIN}
      ALLOWED_DOMAIN: ${PROD_ALLOWED_DOMAIN:-*}
      SECURE_COOKIES: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}.rule=Host(`${PROD_DOMAIN}`)"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}.entrypoints=websecure"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{PROJECT_NAME_SNAKE}}.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.{{PROJECT_NAME_SNAKE}}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.{{PROJECT_NAME_SNAKE}}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}.middlewares={{PROJECT_NAME_SNAKE}}-headers"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME_SNAKE}}_db_prod
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROD_POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Staging environment
  staging_backend:
    image: {{PROJECT_NAME_SNAKE}}:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{PROJECT_NAME_SNAKE}}_staging_backend
    environment:
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@staging_db:5432/${STAGING_POSTGRES_DB}?sslmode=disable
      PORT: 8080
      ENV: staging
      CORS_ORIGINS: https://${STAGING_DOMAIN}
      GOOGLE_CLIENT_ID: ${STAGING_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${STAGING_GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: https://${STAGING_DOMAIN}/api/auth/callback/google
      JWT_SECRET: ${STAGING_JWT_SECRET}
      FRONTEND_URL: https://${STAGING_DOMAIN}
      ALLOWED_DOMAIN: ${STAGING_ALLOWED_DOMAIN:-*}
      SECURE_COOKIES: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}-staging.rule=Host(`${STAGING_DOMAIN}`)"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}-staging.entrypoints=websecure"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{PROJECT_NAME_SNAKE}}-staging.loadbalancer.server.port=8080"
    depends_on:
      staging_db:
        condition: service_healthy
    restart: unless-stopped

  staging_db:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME_SNAKE}}_db_staging
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STAGING_POSTGRES_DB}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  letsencrypt:
  postgres_prod_data:
  postgres_staging_data:
