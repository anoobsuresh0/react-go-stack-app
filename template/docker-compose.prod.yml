services:
  api-prod:
    image: {{PROJECT_NAME_SNAKE}}:production
    environment:
      - DB_HOST=db-prod
      - DB_PORT=5432
      - DB_USER=${PROD_POSTGRES_USER}
      - DB_PASSWORD=${PROD_POSTGRES_PASSWORD}
      - DB_NAME=${PROD_POSTGRES_DB}
      - DB_SSLMODE=disable
      - PORT=8080
      - ENV=production
      - STATIC_PATH=./static
      - CORS_ORIGINS=https://{{PRODUCTION_DOMAIN}}
      - FRONTEND_URL=https://{{PRODUCTION_DOMAIN}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}-prod.rule=Host(`{{PRODUCTION_DOMAIN}}`)"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}-prod.entrypoints=websecure"
      - "traefik.http.routers.{{PROJECT_NAME_SNAKE}}-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.{{PROJECT_NAME_SNAKE}}-prod.loadbalancer.server.port=8080"
    depends_on:
      db-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik-network
      - {{PROJECT_NAME_SNAKE}}-prod-network

  db-prod:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROD_POSTGRES_DB}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER} -d ${PROD_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - {{PROJECT_NAME_SNAKE}}-prod-network

networks:
  traefik-network:
    external: true
  {{PROJECT_NAME_SNAKE}}-prod-network:
    driver: bridge

volumes:
  prod_postgres_data:
